services:
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy
    networks: [app]

  api:
    build: ./apps/api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-face-search}
      FACE_AI_URL: http://face-ai:8001
      REDIS_STREAM: ${REDIS_STREAM:-photo-jobs}
      REDIS_GROUP: ${REDIS_GROUP:-photo-workers}
      DEAD_LETTER_STREAM: ${DEAD_LETTER_STREAM:-photo-jobs-dlq}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
      face-ai: { condition: service_healthy }
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  face-ai:
    build: ./services/face-ai
    environment:
      FACE_AI_ONNX_PROVIDER: CPUExecutionProvider
      FACE_AI_MODEL_REQUIRED: "false"
      FACE_AI_QDRANT_URL: http://qdrant:6333
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  photo-worker:
    build: ./workers/photo-worker
    environment:
      REDIS_URL: redis://redis:6379/0
      FACE_AI_URL: http://face-ai:8001
      REDIS_STREAM: ${REDIS_STREAM:-photo-jobs}
      REDIS_GROUP: ${REDIS_GROUP:-photo-workers}
      DEAD_LETTER_STREAM: ${DEAD_LETTER_STREAM:-photo-jobs-dlq}
    depends_on:
      redis:
        condition: service_healthy
      face-ai:
        condition: service_healthy
    networks: [app]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    networks: [app]

networks:
  app:

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
  caddy-data:
  caddy-config:
