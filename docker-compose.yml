services:
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy
    networks: [app]

  api:
    build: ./apps/api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      DATABASE_SCHEMA_VERSION: ${DATABASE_SCHEMA_VERSION:-3}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY}
      AUTH_ISSUER: ${AUTH_ISSUER:-face-search-api}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-face-search-web}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-face-search}
      PHOTO_MAX_BYTE_SIZE: ${PHOTO_MAX_BYTE_SIZE:-104857600}
      PHOTO_UPLOAD_PART_SIZE: ${PHOTO_UPLOAD_PART_SIZE:-8388608}
      PHOTO_UPLOAD_MAX_PARTS: ${PHOTO_UPLOAD_MAX_PARTS:-1000}
      PHOTO_UPLOAD_SIGN_TTL: ${PHOTO_UPLOAD_SIGN_TTL:-10m}
      PHOTO_UPLOAD_SESSION_TTL: ${PHOTO_UPLOAD_SESSION_TTL:-24h}
      FACE_AI_URL: http://face-ai:8001
      REDIS_STREAM: ${REDIS_STREAM:-photo-jobs}
      REDIS_GROUP: ${REDIS_GROUP:-photo-workers}
      DEAD_LETTER_STREAM: ${DEAD_LETTER_STREAM:-photo-jobs-dlq}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-2s}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_LEASE_TTL: ${OUTBOX_LEASE_TTL:-30s}
    depends_on:
      postgres: { condition: service_healthy }
      migrations: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      face-ai: { condition: service_healthy }
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  face-ai:
    build: ./services/face-ai
    environment:
      FACE_AI_ONNX_PROVIDER: CPUExecutionProvider
      FACE_AI_MODELS_REQUIRED: "false"
      FACE_AI_QDRANT_URL: http://qdrant:6333
      FACE_AI_INTERNAL_TOKEN: ${FACE_AI_INTERNAL_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  photo-worker:
    build: ./workers/photo-worker
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-face-search-faces}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-face-search}
      FACE_AI_URL: http://face-ai:8001
      FACE_AI_INTERNAL_TOKEN: ${FACE_AI_INTERNAL_TOKEN:-}
      REDIS_STREAM: ${REDIS_STREAM:-photo-jobs}
      REDIS_GROUP: ${REDIS_GROUP:-photo-workers}
      DEAD_LETTER_STREAM: ${DEAD_LETTER_STREAM:-photo-jobs-dlq}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      face-ai:
        condition: service_healthy
    networks: [app]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  migrations:
    image: migrate/migrate:v4.18.3
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    networks: [app]
    restart: "no"

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-face-search}
    depends_on:
      minio:
        condition: service_healthy
    networks: [app]
    restart: "no"

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    networks: [app]

networks:
  app:

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
  caddy-data:
  caddy-config:
