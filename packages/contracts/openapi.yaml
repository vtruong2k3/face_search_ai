openapi: 3.1.0
info:
  title: Face Search AI API
  version: 0.2.0
  description: Public API for the Face Search AI MVP.
  license:
    name: Proprietary
security: []
servers:
  - url: /api/v1
paths:
  /:
    get:
      summary: Get API information
      operationId: getApiInfo
      responses:
        "200":
          description: API information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiInfo" }
  /auth/register:
    post:
      summary: Register an account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201": { $ref: "#/components/responses/AuthSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/AuthRejected" }
  /auth/login:
    post:
      summary: Log in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200": { $ref: "#/components/responses/AuthSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRejected" }
  /auth/refresh:
    post:
      summary: Rotate the refresh session
      operationId: refresh
      responses:
        "200": { $ref: "#/components/responses/AuthSuccess" }
        "401": { $ref: "#/components/responses/AuthRejected" }
  /auth/logout:
    post:
      summary: Revoke the refresh session
      operationId: logout
      responses:
        "204": { description: Session revoked }
  /auth/me:
    get:
      summary: Get the current user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/AuthRejected" }
  /organizations:
    get:
      summary: List the current user's active organization memberships
      operationId: listOrganizations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active organization memberships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationMembership" }
        "401": { $ref: "#/components/responses/AuthRejected" }
  /organizations/{organizationId}/membership:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get the authorized current membership
      operationId: getOrganizationMembership
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authorized organization membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMembership" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/events:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      summary: List active Events in an organization
      operationId: listEvents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Create an Event
      operationId: createEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEvent" }
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EventId"
    get:
      summary: Get an Event
      operationId: getEvent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update mutable Event settings
      operationId: updateEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEvent" }
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Archive an Event
      operationId: archiveEvent
      security:
        - bearerAuth: []
      responses:
        "204": { description: Event archived }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/events/{eventId}/status:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EventId"
    get:
      summary: Get trusted Event photo processing counters
      operationId: getEventStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Event processing counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventProcessingStatus" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/events/{eventId}/photos:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EventId"
    get:
      summary: List active Photos in an Event
      operationId: listPhotos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active Photos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Photo" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Create a pending Photo owned by the authorized Event
      operationId: createPhoto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePhoto" }
      responses:
        "201":
          description: Pending Photo created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/events/{eventId}/photos/{photoId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/PhotoId"
    get:
      summary: Get a Photo status
      operationId: getPhoto
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Soft-delete a Photo
      operationId: deletePhoto
      security:
        - bearerAuth: []
      responses:
        "204": { description: Photo deleted or already deleted }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/events/{eventId}/photos/{photoId}/uploads:
    parameters: &photoUploadParameters
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/PhotoId"
    post:
      summary: Initiate or recover a direct multipart upload
      operationId: initiatePhotoUpload
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active multipart upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MultipartUpload" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/events/{eventId}/photos/{photoId}/uploads/parts/{partNumber}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/PhotoId"
      - name: partNumber
        in: path
        required: true
        schema: { type: integer, minimum: 1, maximum: 10000 }
    post:
      summary: Sign one exact multipart upload part
      operationId: signPhotoUploadPart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadReference" }
      responses:
        "200":
          description: Short-lived signed part URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedUploadPart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/events/{eventId}/photos/{photoId}/uploads/complete:
    parameters: *photoUploadParameters
    post:
      summary: Complete and verify a direct multipart upload
      operationId: completePhotoUpload
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteMultipartUpload" }
      responses:
        "200":
          description: Verified uploaded Photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/events/{eventId}/photos/{photoId}/uploads/abort:
    parameters: *photoUploadParameters
    post:
      summary: Idempotently abort a direct multipart upload
      operationId: abortPhotoUpload
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadReference" }
      responses:
        "204": { description: Upload aborted or already inactive }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/events/{eventId}/photos/{photoId}/reprocess:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/PhotoId"
    post:
      summary: Requeue a failed Photo
      operationId: reprocessPhoto
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Photo requeued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /public/events/{publicToken}:
    parameters:
      - name: publicToken
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 200 }
    get:
      summary: Get an eligible public Event
      operationId: getPublicEvent
      responses:
        "200":
          description: Limited public Event capability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicEvent" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Search an eligible public Event with an ephemeral selfie
      description: >-
        Requires affirmative consent and exactly one detected face. The selfie is
        processed in memory for this request only and must not be persisted,
        logged, audited, traced, or returned. Unknown, private, archived, and
        expired Events are intentionally indistinguishable.
      operationId: searchPublicEvent
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/PublicSearchRequest" }
            encoding:
              selfie:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "200":
          description: Event-scoped photo matches without storage or biometric data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/SearchPolicyRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /public/events/{publicToken}/downloads:
    parameters:
      - name: publicToken
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 200 }
    post:
      summary: Issue short-lived download links for scoped Event photos
      description: >-
        Customer download authorization derives only from the opaque public Event
        token, the Event download policy, and result scope. The server re-resolves
        the Event scope on every request, requires downloads to be enabled, and
        confirms each requested photo belongs to the resolved Event and is in a
        downloadable (READY) state before signing access. Each returned link is a
        short-lived, object-scoped signed URL that expires and cannot be replayed
        for any other object, Event, or tenant. No grant token is persisted or
        returned. Unknown, private, archived, and expired Events and Events with
        downloads disabled are intentionally indistinguishable. Requests are rate
        limited and audited without recording signed URLs, object paths, or tokens.
      operationId: issuePublicDownloads
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicDownloadRequest" }
      responses:
        "200":
          description: Short-lived download links for the requested in-scope photos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicDownloadResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    AuthSuccess:
      description: Authentication succeeded; the refresh token is set as an HttpOnly cookie.
      headers:
        Set-Cookie:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthResponse" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AuthRejected:
      description: Authentication request rejected
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource was not found or is not available to the caller
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Request body exceeds the bounded selfie-search limit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SearchPolicyRejected:
      description: Selfie or consent does not satisfy the privacy search policy
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SearchError" }
    RateLimited:
      description: Search rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Search dependencies are temporarily unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ApiInfo:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: { type: string }
        version: { type: string }
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
    User:
      type: object
      additionalProperties: false
      required: [id, email, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
    OrganizationMembership:
      type: object
      additionalProperties: false
      required: [organizationId, organizationName, role]
      properties:
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        role: { type: string, enum: [owner, admin, editor, viewer] }
    EventVisibility:
      type: string
      enum: [private, public]
    CreateEvent:
      type: object
      additionalProperties: false
      required: [name, visibility, downloadsEnabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        visibility: { $ref: "#/components/schemas/EventVisibility" }
        expiresAt: { type: [string, "null"], format: date-time }
        downloadsEnabled: { type: boolean }
        matchThreshold:
          description: Optional cosine-similarity policy override; no production default is approved.
          type: [number, "null"]
          minimum: -1
          maximum: 1
    UpdateEvent:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        visibility: { $ref: "#/components/schemas/EventVisibility" }
        expiresAt: { type: [string, "null"], format: date-time }
        downloadsEnabled: { type: boolean }
        matchThreshold:
          description: Optional cosine-similarity policy override; no production default is approved.
          type: [number, "null"]
          minimum: -1
          maximum: 1
    Event:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          name,
          visibility,
          status,
          expiresAt,
          downloadsEnabled,
          matchThreshold,
          createdByUserId,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        visibility: { $ref: "#/components/schemas/EventVisibility" }
        status: { type: string, enum: [active, archived] }
        expiresAt: { type: [string, "null"], format: date-time }
        downloadsEnabled: { type: boolean }
        matchThreshold: { type: [number, "null"], minimum: -1, maximum: 1 }
        createdByUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicEvent:
      type: object
      additionalProperties: false
      required: [name, expiresAt, downloadsEnabled]
      properties:
        name: { type: string }
        expiresAt: { type: [string, "null"], format: date-time }
        downloadsEnabled: { type: boolean }
    PublicSearchRequest:
      type: object
      additionalProperties: false
      required: [selfie, consent, consentVersion]
      description: >-
        Ephemeral customer query. The server accepts one bounded image part,
        requires affirmative consent, and never stores the selfie bytes.
      properties:
        selfie:
          type: string
          format: binary
          description: JPEG, PNG, or WebP selfie; maximum 10 MiB.
          contentMediaType: image/jpeg
          maxLength: 10485760
        consent:
          type: string
          const: "true"
          description: Must be the literal multipart value true.
        consentVersion:
          type: string
          minLength: 1
          maxLength: 64
    PublicSearchResponse:
      type: object
      additionalProperties: false
      required: [results, nextCursor]
      properties:
        results:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/PublicSearchResult" }
        nextCursor:
          type: [string, "null"]
          maxLength: 512
    PublicSearchResult:
      type: object
      additionalProperties: false
      required: [photoId]
      description: >-
        Opaque Event-scoped photo identity only. Original files, storage keys,
        signed URLs, embeddings, face identifiers, scores, and uploader data are
        intentionally excluded until separately authorized by a download contract.
      properties:
        photoId: { type: string, format: uuid }
    PublicDownloadRequest:
      type: object
      additionalProperties: false
      required: [photoIds]
      description: >-
        Bounded set of Event-scoped photo identifiers to download. Identifiers
        come from a prior selfie search for the same public Event. The request is
        rejected uniformly when any identifier is not part of the resolved Event
        or is not in a downloadable state.
      properties:
        photoIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
    PublicDownloadResponse:
      type: object
      additionalProperties: false
      required: [downloads]
      properties:
        downloads:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/PublicDownload" }
    PublicDownload:
      type: object
      additionalProperties: false
      required: [photoId, url, expiresAt]
      description: >-
        A single short-lived, object-scoped download link. The URL is signed for
        exactly one stored original and expires at expiresAt; it grants no other
        access and is never logged or audited.
      properties:
        photoId: { type: string, format: uuid }
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    SearchError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            [
              consent_required,
              invalid_image,
              unsupported_media_type,
              selfie_too_large,
              face_count_zero,
              face_count_multiple,
              invalid_cursor,
            ]
        message: { type: string }
    EventProcessingStatus:
      type: object
      additionalProperties: false
      required:
        [
          eventId,
          activeTotal,
          pending,
          uploading,
          uploaded,
          queued,
          processing,
          ready,
          failed,
          deleted,
        ]
      properties:
        eventId: { type: string, format: uuid }
        activeTotal: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        uploading: { type: integer, minimum: 0 }
        uploaded: { type: integer, minimum: 0 }
        queued: { type: integer, minimum: 0 }
        processing: { type: integer, minimum: 0 }
        ready: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        deleted: { type: integer, minimum: 0 }
    PhotoStatus:
      type: string
      enum: [pending, uploading, uploaded, queued, processing, ready, failed]
    CreatePhoto:
      type: object
      additionalProperties: false
      required: [originalFilename, contentType, byteSize]
      properties:
        originalFilename: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        byteSize: { type: integer, minimum: 1, maximum: 104857600 }
        checksumSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
    MultipartUpload:
      type: object
      additionalProperties: false
      required: [photoId, uploadId, partSize, partCount, expiresAt]
      properties:
        photoId: { type: string, format: uuid }
        uploadId: { type: string, minLength: 1, maxLength: 200 }
        partSize: { type: integer, minimum: 5242880 }
        partCount: { type: integer, minimum: 1, maximum: 10000 }
        expiresAt: { type: string, format: date-time }
    UploadReference:
      type: object
      additionalProperties: false
      required: [uploadId]
      properties:
        uploadId: { type: string, minLength: 1, maxLength: 200 }
    SignedUploadPart:
      type: object
      additionalProperties: false
      required: [partNumber, url, expiresAt]
      properties:
        partNumber: { type: integer, minimum: 1, maximum: 10000 }
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    CompletedUploadPart:
      type: object
      additionalProperties: false
      required: [partNumber, etag]
      properties:
        partNumber: { type: integer, minimum: 1, maximum: 10000 }
        etag: { type: string, minLength: 1, maxLength: 200 }
    CompleteMultipartUpload:
      type: object
      additionalProperties: false
      required: [uploadId, parts]
      properties:
        uploadId: { type: string, minLength: 1, maxLength: 200 }
        parts:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: "#/components/schemas/CompletedUploadPart" }
    Photo:
      type: object
      additionalProperties: false
      required:
        [
          id,
          eventId,
          originalFilename,
          contentType,
          byteSize,
          status,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        originalFilename: { type: string }
        contentType: { type: string }
        byteSize: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/PhotoStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, minimum: 1 }
        user: { $ref: "#/components/schemas/User" }
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
