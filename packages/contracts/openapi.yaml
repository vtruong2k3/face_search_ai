openapi: 3.1.0
info:
  title: Face Search AI API
  version: 0.2.0
  description: Public API for the Face Search AI MVP.
  license:
    name: Proprietary
security: []
servers:
  - url: /api/v1
paths:
  /:
    get:
      summary: Get API information
      operationId: getApiInfo
      responses:
        "200":
          description: API information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiInfo" }
  /auth/register:
    post:
      summary: Register an account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201": { $ref: "#/components/responses/AuthSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/AuthRejected" }
  /auth/login:
    post:
      summary: Log in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200": { $ref: "#/components/responses/AuthSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRejected" }
  /auth/refresh:
    post:
      summary: Rotate the refresh session
      operationId: refresh
      responses:
        "200": { $ref: "#/components/responses/AuthSuccess" }
        "401": { $ref: "#/components/responses/AuthRejected" }
  /auth/logout:
    post:
      summary: Revoke the refresh session
      operationId: logout
      responses:
        "204": { description: Session revoked }
  /auth/me:
    get:
      summary: Get the current user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/AuthRejected" }
  /organizations:
    get:
      summary: List the current user's active organization memberships
      operationId: listOrganizations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active organization memberships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationMembership" }
        "401": { $ref: "#/components/responses/AuthRejected" }
  /organizations/{organizationId}/membership:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get the authorized current membership
      operationId: getOrganizationMembership
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authorized organization membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMembership" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/events:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      summary: List active Events in an organization
      operationId: listEvents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Create an Event
      operationId: createEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEvent" }
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EventId"
    get:
      summary: Get an Event
      operationId: getEvent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update mutable Event settings
      operationId: updateEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEvent" }
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Archive an Event
      operationId: archiveEvent
      security:
        - bearerAuth: []
      responses:
        "204": { description: Event archived }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/events/{eventId}/status:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EventId"
    get:
      summary: Get trusted Event photo processing counters
      operationId: getEventStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Event processing counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventProcessingStatus" }
        "401": { $ref: "#/components/responses/AuthRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    AuthSuccess:
      description: Authentication succeeded; the refresh token is set as an HttpOnly cookie.
      headers:
        Set-Cookie:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthResponse" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AuthRejected:
      description: Authentication request rejected
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource was not found or is not available to the caller
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ApiInfo:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: { type: string }
        version: { type: string }
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
    User:
      type: object
      additionalProperties: false
      required: [id, email, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
    OrganizationMembership:
      type: object
      additionalProperties: false
      required: [organizationId, organizationName, role]
      properties:
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        role: { type: string, enum: [owner, admin, editor, viewer] }
    EventVisibility:
      type: string
      enum: [private, public]
    CreateEvent:
      type: object
      additionalProperties: false
      required: [name, visibility, downloadsEnabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        visibility: { $ref: "#/components/schemas/EventVisibility" }
        expiresAt: { type: [string, "null"], format: date-time }
        downloadsEnabled: { type: boolean }
        matchThreshold:
          description: Optional cosine-similarity policy override; no production default is approved.
          type: [number, "null"]
          minimum: -1
          maximum: 1
    UpdateEvent:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        visibility: { $ref: "#/components/schemas/EventVisibility" }
        expiresAt: { type: [string, "null"], format: date-time }
        downloadsEnabled: { type: boolean }
        matchThreshold:
          description: Optional cosine-similarity policy override; no production default is approved.
          type: [number, "null"]
          minimum: -1
          maximum: 1
    Event:
      type: object
      additionalProperties: false
      required: [id, organizationId, name, visibility, status, expiresAt, downloadsEnabled, matchThreshold, createdByUserId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        visibility: { $ref: "#/components/schemas/EventVisibility" }
        status: { type: string, enum: [active, archived] }
        expiresAt: { type: [string, "null"], format: date-time }
        downloadsEnabled: { type: boolean }
        matchThreshold: { type: [number, "null"], minimum: -1, maximum: 1 }
        createdByUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EventProcessingStatus:
      type: object
      additionalProperties: false
      required: [eventId, activeTotal, pending, uploading, uploaded, queued, processing, ready, failed, deleted]
      properties:
        eventId: { type: string, format: uuid }
        activeTotal: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        uploading: { type: integer, minimum: 0 }
        uploaded: { type: integer, minimum: 0 }
        queued: { type: integer, minimum: 0 }
        processing: { type: integer, minimum: 0 }
        ready: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        deleted: { type: integer, minimum: 0 }
    AuthResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, minimum: 1 }
        user: { $ref: "#/components/schemas/User" }
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
