[project]
name = "photo-worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bot MMO", email = "bot@mmo.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "prometheus-client>=0.26.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.0",
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[project.scripts]
photo-worker = "photo_worker:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]
